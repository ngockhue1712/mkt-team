<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Agency marketing AI của bạn. Đặt brief, phối hợp phòng ban và duyệt sản phẩm trong một không gian."><title>MKT Studio — Agency AI của bạn</title><link rel="stylesheet" href="/assets/voxel-ui.css?v=14"></head><body><div class="shell"><header class="topbar"><button class="logo" data-nav="home" aria-label="MKT Studio — Văn phòng"><span class="puppy-logo" aria-hidden="true"><i></i></span>MKT Studio</button><nav class="nav" aria-label="Điều hướng chính"><button data-nav="home" class="active">Văn phòng</button><button data-nav="orders">Order</button><button data-nav="review">Chờ duyệt</button><button data-nav="brand">Thương hiệu</button></nav><div class="topbar-right"><button class="connection" id="connect"><span class="dot" id="connectionDot"></span><span id="connectionLabel">AI tùy chọn</span></button><span class="avatar" aria-label="Workspace cá nhân">M</span></div></header><main class="main"><span id="breadcrumb" hidden>Tổng quan</span><div class="content" id="app"></div></main></div><div id="modalRoot"></div><div id="toast" role="status" aria-live="polite"></div><script src="/assets/voxel-office.js?v=12"></script><script src="/assets/office-ui.js?v=14"></script>
<script>
const DEPTS={account:{name:'Account & Điều phối',icon:'↗',desc:'Tiếp nhận brief, chia đầu việc và quản lý bàn giao.',tag:'Đầu mối của mọi order'},strategy:{name:'Research & Strategy',icon:'⌕',desc:'Từ mục tiêu kinh doanh đến insight và chiến lược.',tag:'Insight · Campaign plan'},content:{name:'Content & Social',icon:'≋',desc:'Biến ý tưởng thành bài viết và kịch bản có thể dùng.',tag:'Caption · Script · Calendar'},creative:{name:'Creative & Design',icon:'✧',desc:'Concept, art direction và brief thiết kế chi tiết.',tag:'Concept · Visual brief'},performance:{name:'Performance',icon:'▥',desc:'Lập ngân sách, media plan và phương án thử nghiệm.',tag:'Media plan · A/B testing'},qa:{name:'Quality Assurance',icon:'✓',desc:'Đối chiếu brief, kiểm tra chất lượng trước khi bạn duyệt.',tag:'Kiểm tra đầu ra'}};
Object.defineProperties(DEPTS,{account_work:{value:{...DEPTS.account,name:'Account · Sản phẩm bàn giao'}},qa_work:{value:{...DEPTS.qa,name:'QA · Báo cáo rà soát'}}});
const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let storageOK=true;let state;try{state=JSON.parse(localStorage.getItem('mkt-studio-v1')||'null');}catch{storageOK=false;}if(!state||!Array.isArray(state.orders)||!state.brand)state={orders:[],brand:{name:'',audience:'',voice:'',facts:'',avoid:''},model:'gpt-5-mini'};
let route='home',activeId=null,activeTab='account',busy=false,apiKey='',serverConfigured=false,toastTimer,formDraft=null;
function save(){try{localStorage.setItem('mkt-studio-v1',JSON.stringify(state));}catch{storageOK=false;toast('Không lưu được trên trình duyệt. Hãy xuất bản sao dữ liệu.');}}
function toast(t){$('#toast').className='toast';$('#toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('#toast').className='';$('#toast').textContent='';},5500);}
function status(o){return ({draft:'Bản nháp',sending_brief:'Đang gửi brief',not_sent:'Chưa gửi',received:'Đã nhận · Chờ xử lý',clarify:'Cần bổ sung brief',running:'AI đang thực hiện',error:'Cần xử lý',review:'Chờ bạn duyệt',qa_failed:'QA cần kiểm tra',approved:'Đã duyệt',revision:'Đang sửa'})[o.status]||o.status;}
function badge(o){return '<span class="badge '+(o.status==='approved'?'approved':['clarify','qa_failed'].includes(o.status)?'warn':['error','not_sent'].includes(o.status)?'error':'')+'">'+esc(status(o))+'</span>';}
function current(){return state.orders.find(o=>o.id===activeId);}function nav(r){captureQuickDrafts();if(route==='new')captureForm();if(r==='home'&&route!=='home')selectedRoom=null;route=r;render();if(['home','orders','review'].includes(r))refreshOfficeList();window.scrollTo({top:0,behavior:'smooth'});}
function updateConnection(){if(hasAgencyInbox()){$('#connectionDot').className='dot ok';$('#connectionLabel').textContent='Agency tự chạy';return;}$('#connectionDot').className='dot'+(apiKey||serverConfigured?' ok':'');$('#connectionLabel').textContent=apiKey||serverConfigured?(serverConfigured?'AI do máy chủ cung cấp':'Đã nhập key · Chưa xác minh'):hasAgencyInbox()?'AI của Studio':'AI tùy chọn';}
function cards(){return '<div class="dept-grid">'+Object.entries(DEPTS).map(([k,d])=>'<button class="dept" data-dept="'+k+'"><div class="dept-top"><span class="dept-icon">'+d.icon+'</span><span class="pill">AI chuyên trách</span></div><h3>'+d.name+'</h3><p>'+d.desc+'</p><div class="dept-foot"><span>'+d.tag+'</span><b>↗</b></div></button>').join('')+'</div>';}
function heading(title,sub,button=''){return '<div class="pageheading"><div><span class="eyebrow">YOUR AI MARKETING AGENCY</span><h1>'+title+'</h1><p class="muted">'+sub+'</p></div>'+button+'</div>';}
function newButton(){return '<button class="btn primary" data-new>＋ Tạo order mới</button>';}
function rows(orders){if(!orders.length)return '<div class="empty"><div class="big">▤</div><h3>Chưa có order nào ở đây</h3><p class="muted">Bắt đầu từ một brief. Agency AI sẽ tiếp nhận phần còn lại.</p><button class="btn primary small" data-new>Tạo order đầu tiên ↗</button></div>';return orders.map(o=>'<div class="order-row" tabindex="0" role="button" data-order="'+o.id+'"><div><h3>'+esc(o.title)+'</h3><small>'+esc(o.id.slice(0,8).toUpperCase())+' · '+(o.mode==='full'?'Agency trọn gói':esc(DEPTS[o.department]?.name))+' · '+new Date(o.created).toLocaleDateString('vi-VN')+'</small></div><div>'+badge(o)+'</div></div>').join('');}
function home(){return officeHome();}
function form(){const d=formDraft||{mode:'full',department:'content',title:'',brief:'',deadline:'',budget:'',deliverables:''};return heading('Agency sẵn sàng nhận brief.','Mô tả điều bạn cần. Gửi yêu cầu cho cả agency hoặc một phòng ban.')+'<form id="orderForm"><div class="segmented"><button type="button" data-mode="full" class="'+(d.mode==='full'?'selected':'')+'"><b>✳ Agency trọn gói</b><small>Account tự chọn phòng ban theo brief</small></button><button type="button" data-mode="single" class="'+(d.mode==='single'?'selected':'')+'"><b>↗ Order một phòng ban</b><small>Giao đúng một đầu việc chuyên môn</small></button></div><div class="form-grid"><div class="panel"><div class="field"><label for="title">Tên order *</label><input id="title" name="title" maxlength="150" required value="'+esc(d.title)+'" placeholder="VD: Nội dung ra mắt bộ sưu tập túi tháng 11"></div>'+(d.mode==='single'?'<div class="field"><label for="department">Phòng ban thực hiện</label><select id="department" name="department">'+Object.entries(DEPTS).map(([k,v])=>'<option value="'+k+'" '+(d.department===k?'selected':'')+'>'+v.name+'</option>').join('')+'</select></div>':'')+'<div class="field"><label for="brief">Brief của bạn *</label><textarea id="brief" name="brief" required maxlength="12000" style="min-height:210px" placeholder="Sản phẩm/dịch vụ là gì? Bạn muốn đạt mục tiêu nào? Khách hàng là ai? Đăng trên kênh nào? Có thông tin nào phải dùng hoặc cần tránh?">'+esc(d.brief)+'</textarea></div><div class="field"><label for="deliverables">Đầu ra cần nhận *</label><textarea id="deliverables" name="deliverables" required maxlength="4000" placeholder="VD: 5 caption Facebook, 2 kịch bản TikTok 30 giây và brief thiết kế cho 3 visual">'+esc(d.deliverables)+'</textarea></div></div><div><div class="panel"><h3>Thông tin để làm đúng ngay từ đầu</h3><div class="field"><label for="deadline">Deadline mong muốn</label><input id="deadline" name="deadline" type="date" value="'+esc(d.deadline)+'"><small>Được ghi vào brief; chưa có lịch tự chạy khi đóng web.</small></div><div class="field"><label for="budget">Ngân sách marketing</label><input id="budget" name="budget" maxlength="100" value="'+esc(d.budget)+'" placeholder="VD: 20.000.000 VNĐ / tháng"><small>Ngân sách campaign, không phải phí gọi AI.</small></div><div class="hint">◇ Thương hiệu: <b>'+esc(state.brand.name||'Chưa thiết lập')+'</b><br>Tài liệu thương hiệu sẽ được gửi kèm brief cho các phòng ban.</div><div class="field"><label for="referenceFile">Thêm tài liệu tham khảo (.txt, .md)</label><input class="file-input" id="referenceFile" type="file" accept=".txt,.md,text/plain,text/markdown"><small>Nội dung được thêm vào brief; tối đa 25 KB.</small></div></div>'+imagePicker(d.imageMode)+'<div class="hint">Ấn phẩm và nội dung được gửi về mục Chờ duyệt.</div></div></div><div class="form-actions"><button type="button" class="btn" data-route="home">Quay lại</button><button type="submit" class="btn primary" '+(busy?'disabled':'')+'>Gửi brief cho agency ↗</button></div>'+intakeNote()+'</form>';}
function brand(){const b=state.brand;return heading('Một thương hiệu. Một tiếng nói.','Lưu bối cảnh để mọi phòng ban cùng làm theo.')+'<div class="form-grid"><form class="panel" id="brandForm">'+[['name','Tên thương hiệu','VD: HAPAS'],['audience','Khách hàng mục tiêu','Độ tuổi, nhu cầu, thị trường, ngôn ngữ'],['voice','Giọng điệu & phong cách','VD: Gần gũi, tinh tế, tự tin; xưng hô bạn – mình'],['facts','Thông tin đã xác thực','Sản phẩm, giá, điểm khác biệt, chính sách và các nguồn bạn cung cấp'],['avoid','Điều cần tránh','Từ ngữ cấm, claim chưa được xác thực, đối thủ không nhắc tới']].map(([k,l,p])=>'<div class="field"><label for="brand-'+k+'">'+l+'</label>'+(k==='name'?'<input id="brand-'+k+'" name="'+k+'" maxlength="150" value="'+esc(b[k])+'" placeholder="'+p+'">':'<textarea id="brand-'+k+'" name="'+k+'" maxlength="6000" placeholder="'+p+'">'+esc(b[k])+'</textarea>')+'</div>').join('')+'<button class="btn primary">Lưu thương hiệu</button></form><div><div class="brand-preview"><span class="eyebrow" style="color:#c1d59d">BRAND MEMORY</span><h2 style="margin-top:15px">'+esc(b.name||'Thương hiệu của bạn')+'</h2><p>'+esc(b.voice||'Tạo bối cảnh chung cho cả agency.')+'</p></div><div class="hint">Dữ liệu được lưu trên trình duyệt này. Hãy xuất bản sao để chuyển máy hoặc phòng mất dữ liệu. API key không nằm trong bản sao.</div><div class="panel"><h3>Sao lưu workspace</h3><p class="muted">Bao gồm thương hiệu, brief, đầu ra và lịch sử duyệt.</p><button type="button" class="btn small" id="backup">↓ Xuất dữ liệu JSON</button><div class="field" style="margin-top:18px"><label for="importFile">Khôi phục bản sao JSON</label><input id="importFile" type="file" accept=".json"><small>Order trùng ID được giữ nguyên; chỉ thêm order chưa có.</small></div></div></div></div>';}
function formatJSON(role,raw){try{const d=JSON.parse(raw);if(role==='account')return 'BRIEF ĐÃ TIẾP NHẬN\n\n'+d.summary+'\n\nPHÒNG BAN THỰC HIỆN\n'+(d.departments||[]).map(k=>'• '+(DEPTS[k]?.name||k)).join('\n')+'\n\nTIÊU CHÍ NGHIỆM THU\n'+(d.acceptance||[]).map(x=>'• '+x).join('\n')+(d.needs_clarification?'\n\nCẦN BẠN BỔ SUNG\n'+d.questions.map((q,i)=>(i+1)+'. '+q).join('\n'):'');if(role==='qa')return (d.passed?'✓ QA đạt':'△ QA cần kiểm tra')+'\n\n'+d.summary+'\n\n'+(d.checklist||[]).map(x=>(x.passed?'✓ ':'✕ ')+x.criterion).join('\n')+'\n\n'+(d.issues||[]).map(x=>'['+(DEPTS[x.department]?.name||x.department)+'] '+x.issue+'\nCần sửa: '+x.fix).join('\n\n');}catch{}return raw;}
function detail(){const o=current();if(!o){route='orders';return rows(state.orders);}const pipeline=o.pipeline||['account'];const output=o.outputs[activeTab];const versions=(o.history||[]).filter(v=>v.role===activeTab);return heading(esc(o.title),'Order '+esc(o.id.slice(0,8).toUpperCase())+' · '+new Date(o.created).toLocaleString('vi-VN'),'<button class="btn small" id="export">↓ Xuất bàn giao</button>')+'<div class="meta">'+badge(o)+'<span>'+esc(o.mode==='full'?'Agency trọn gói':DEPTS[o.department]?.name)+'</span><span>Deadline: '+esc(o.deadline||'Chưa đặt')+'</span><span>'+o.calls+' lượt gọi AI</span></div>'+outcomePanel(o)+intakePanel(o)+(o.status==='draft'&&!hasAgencyInbox()?'<div class="hint">Order đã lưu. <button class="btn primary small" id="startDraft">'+(apiKey||serverConfigured?'Chạy order':'Kết nối AI & chạy order')+'</button></div>':'')+'<div class="workflow">'+pipeline.map(k=>'<span class="step '+(o.runningRole===k&&busy?'running busy':o.outputs[k]?'done':'')+'">'+(o.outputs[k]?'✓ ':'')+DEPTS[k].name+'</span>').join('')+'</div>'+(o.error?'<div class="error-box" role="alert">'+esc(o.error)+'<br>'+(hasAgencyInbox()?'':'<button type="button" class="btn small" id="adjustConnection">Kiểm tra key / model</button> ')+'<button class="btn small" id="retry" '+(busy?'disabled':'')+' style="margin-top:10px">Tiếp tục từ bước lỗi</button></div>':'')+(o.status==='clarify'?'<div class="panel" style="margin-bottom:18px"><h3>Account cần bạn bổ sung</h3><p>'+esc((o.questions||[]).join('\n'))+'</p><textarea id="clarification" maxlength="6000" placeholder="Trả lời các câu hỏi để agency tiếp tục"></textarea><button class="btn primary small" id="clarify" style="margin-top:12px" '+(busy?'disabled':'')+'>Bổ sung và tiếp tục</button></div>':'')+'<div class="detail-grid"><div class="tasknav"><button data-task="brief" class="'+(activeTab==='brief'?'selected':'')+'">▤ Brief gốc<small>Yêu cầu & tài liệu thương hiệu</small></button>'+pipeline.map(k=>'<button data-task="'+k+'" class="'+(activeTab===k?'selected':'')+'">'+DEPTS[k].icon+' '+DEPTS[k].name+'<small>'+(o.runningRole===k&&busy?'Đang thực hiện…':o.outputs[k]?'Đã có kết quả':'Chờ bàn giao')+'</small></button>').join('')+'</div><div class="panel"><div class="output-title"><h2>'+esc(activeTab==='brief'?'Brief & bối cảnh':DEPTS[activeTab]?.name||'Đầu ra')+'</h2>'+(output?'<button class="btn small" id="copy">Sao chép</button>':'')+'</div><pre class="output" id="output">'+esc(activeTab==='brief'?briefContext(o):output?formatJSON(activeTab,output):busy&&o.runningRole===activeTab?(o.background?'Phòng đang làm việc. Bạn có thể đóng trang và quay lại xem bản bàn giao.':'AI đang thực hiện. Giữ trang mở để theo dõi kết quả.'):'Kết quả sẽ xuất hiện sau khi phòng ban thực hiện.')+'</pre>'+(versions.length?'<details><summary class="muted">'+versions.length+' phiên bản trước</summary>'+versions.map(v=>'<details style="margin:10px 0"><summary>'+new Date(v.at).toLocaleString('vi-VN')+'</summary><pre class="output">'+esc(formatJSON(v.role,v.output))+'</pre></details>').join('')+'</details>':'')+(busy?'<div class="progress-note busy">● Agency đang xử lý '+esc(DEPTS[o.runningRole]?.name||'order')+'. Các kết quả đã xong được lưu tự động.</div>':'')+(o.status==='qa_failed'&&o.engine!=='office'&&o.outputs.qa&&!busy?'<div class="review"><h3>Quyết định cuối cùng thuộc về bạn</h3>'+(o.status==='qa_failed'?'<div class="hint warning">QA còn phát hiện vấn đề. Dùng “Sửa theo QA” để các phòng ban liên quan xử lý trước khi duyệt.</div>':'')+(o.status==='approved'?'<div class="hint">✓ Đã được bạn duyệt lúc '+new Date(o.approvedAt).toLocaleString('vi-VN')+'.</div>':'')+'<textarea id="feedback" maxlength="5000" placeholder="VD: Giữ concept, viết lại caption theo giọng gần gũi hơn; bỏ claim chưa có nguồn."></textarea><div class="review-actions"><button class="btn primary small" id="approve" '+(o.status!=='review'?'disabled':'')+'>✓ Duyệt đầu ra</button><button class="btn small" id="revise">Yêu cầu sửa</button>'+(o.status==='qa_failed'?'<button class="btn small" id="fixqa">Sửa theo QA</button>':'')+'</div><p class="muted" style="font-size:11px">Duyệt ghi nhận quyết định của bạn; không tự đăng bài hay chi tiền quảng cáo.</p></div>':'')+'</div></div>';}
function render(){captureQuickDrafts();officeScene?.destroy();officeScene=null;document.querySelectorAll('[data-nav]').forEach(n=>n.classList.toggle('active',n.dataset.nav===route));$('#breadcrumb').textContent=({home:'Tổng quan',orders:'Order của tôi',departments:'Phòng ban AI',review:'Chờ duyệt',brand:'Thương hiệu',new:'Tạo order',detail:'Chi tiết order'})[route];$('#app').innerHTML=(route==='home'?home():route==='new'?form():route==='brand'?brand():route==='departments'?heading('Đúng chuyên môn. Đúng đầu việc.','Chọn phòng để giao việc riêng. Mọi đầu ra đều được kiểm tra trước khi bạn duyệt.')+cards():route==='detail'?detail():heading(route==='review'?'Đầu ra đang chờ bạn.':'Mọi order, cùng một nơi.',route==='review'?'Xem sản phẩm, phản hồi và quyết định duyệt.':'Từ brief đầu tiên đến phiên bản được phê duyệt.',newButton())+rows(route==='review'?state.orders.filter(o=>['review','qa_failed'].includes(o.status)):state.orders))+'<footer><span>MKT Studio · Agency AI, bạn giữ quyền duyệt.</span><span>'+(storageOK?'Dữ liệu lưu trên trình duyệt này · Xuất bản sao định kỳ':'⚠ Không lưu được dữ liệu · Hãy xuất bản sao')+'</span></footer>';bind();bindOffice();}
function captureForm(){if(!$('#orderForm'))return;const values=Object.fromEntries(new FormData($('#orderForm')));formDraft={...formDraft,...values};}
function begin(dept){if(busy){toast('Hãy chờ order hiện tại hoàn tất.');return;}formDraft={mode:dept?'single':'full',department:dept||'content',title:'',brief:'',deliverables:'',deadline:'',budget:''};nav('new');}
function bind(){document.querySelectorAll('[data-new]').forEach(n=>n.onclick=()=>begin());document.querySelectorAll('[data-route]').forEach(n=>n.onclick=()=>nav(n.dataset.route));document.querySelectorAll('[data-dept]').forEach(n=>n.onclick=()=>{openRoom(n.dataset.dept);});document.querySelectorAll('[data-order]').forEach(n=>{const go=()=>{activeId=n.dataset.order;activeTab=current()?.outputs?.account?'account':'brief';nav('detail');resumeOfficeView(current());};n.onclick=go;n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});document.querySelectorAll('[data-mode]').forEach(n=>n.onclick=()=>{captureForm();formDraft.mode=n.dataset.mode;render();});document.querySelectorAll('[data-task]').forEach(n=>n.onclick=()=>{activeTab=n.dataset.task;render();});
if ($('#orderForm')) $('#orderForm').onsubmit = async event => {
  event.preventDefault();
  const form = event.currentTarget;
  if (busy || form.dataset.submitting) return;
  form.dataset.submitting = 'true';
  try {
    captureForm();
    const values = { ...formDraft };
    const file = $('#referenceFile').files[0];
    if (file && (file.size > 25000 || !/\.(txt|md)$/i.test(file.name))) {
      toast('Chỉ nhận .txt/.md tối đa 25 KB.');
      return;
    }
    const reference = file ? await file.text() : '';
    await submitOrder({ ...values, reference });
  } finally {
    delete form.dataset.submitting;
  }
};
if($('#brandForm'))$('#brandForm').onsubmit=e=>{e.preventDefault();state.brand=Object.fromEntries(new FormData(e.target));save();toast('Đã lưu bối cảnh thương hiệu. Áp dụng cho order mới.');render();};
if ($('#runOffice')) $('#runOffice').onclick=()=>runOfficeOrder(current());
if ($('#approveDelivery')) $('#approveDelivery').onclick=()=>{
  const order=current();
  if(order.engine==='office')return runOfficeOrder(order,'approve');
  if(order.status==='review'){order.status='approved';order.approvedAt=new Date().toISOString();save();render();}
};
if ($('#reviseDelivery')) $('#reviseDelivery').onclick=()=>{const feedback=$('#deliveryFeedback').value.trim();if(feedback){if(current().engine==='office')runOfficeOrder(current(),'revise',feedback);else revise(current(),feedback,false);}else toast('Nhập phần bạn muốn sửa.');};
if ($('#sendBriefAgain')) $('#sendBriefAgain').onclick = () => sendAgencyBrief(current());
if ($('#copyHandoff')) $('#copyHandoff').onclick = () => copyForChat(current());
if ($('#startDraft')) $('#startDraft').onclick = () => (apiKey || serverConfigured) ? execute(current()) : openConnection();
if($('#adjustConnection'))$('#adjustConnection').onclick=openConnection;
if($('#retry'))$('#retry').onclick=()=>hasAgencyInbox()?(current().receivedAt?runOfficeOrder(current()):sendAgencyBrief(current())):apiKey||serverConfigured?execute(current()):openConnection();if($('#clarify'))$('#clarify').onclick=()=>{const t=$('#clarification').value.trim();if(!t){toast('Hãy bổ sung câu trả lời.');return;}const o=current();o.clarifications=(o.clarifications||'')+'\n'+t;archive(o,'account');o.outputs={};o.pipeline=['account'];o.status='draft';save();execute(o);};
if($('#copy'))$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(formatJSON(activeTab,current().outputs[activeTab]));toast('Đã sao chép.');}catch{toast('Không truy cập được clipboard. Bạn có thể chọn nội dung và sao chép.');}};
if($('#approve'))$('#approve').onclick=()=>{const o=current();if(o.status!=='review')return;o.status='approved';o.approvedAt=new Date().toISOString();save();render();toast('Đã duyệt. Sản phẩm sẵn sàng để bạn sử dụng.');};
if($('#revise'))$('#revise').onclick=()=>{const t=$('#feedback').value.trim();if(!t){toast('Nhập phản hồi để AI biết cần sửa gì.');return;}revise(current(),t,false);};if($('#fixqa'))$('#fixqa').onclick=()=>revise(current(),'Xử lý tất cả lỗi QA và kiểm tra lại. '+($('#feedback')?.value||''),true);
if($('#export'))$('#export').onclick=()=>exportOrder(current());if($('#backup'))$('#backup').onclick=()=>download('mkt-studio-backup.json',JSON.stringify(state,null,2),'application/json');if($('#importFile'))$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5000000)throw Error();const b=JSON.parse(await f.text());if(!Array.isArray(b.orders)||!b.brand||b.orders.some(o=>!o.id||!o.title||!o.outputs||!Array.isArray(o.pipeline)||o.pipeline.some(k=>!DEPTS[k])))throw Error();const existing=new Set(state.orders.map(o=>o.id));const newOrders=b.orders.filter(o=>!existing.has(o.id)).map(o=>({...o,status:['running','revision'].includes(o.status)?'error':o.status,error:['running','revision'].includes(o.status)?'Phiên trước bị ngắt. Bấm Tiếp tục để chạy tiếp.':o.error}));state.orders.push(...newOrders);if(!state.brand.name)state.brand=b.brand;save();toast('Đã khôi phục '+newOrders.length+' order mới.');render();}catch{toast('Bản sao không hợp lệ hoặc quá lớn (tối đa 5 MB).');}};
}
function briefContext(o){return 'ORDER: '+o.title+'\nLOẠI: '+(o.mode==='full'?'Trọn gói':'Phòng ban: '+o.department)+'\nBRIEF:\n'+o.brief+'\nDELIVERABLES:\n'+o.deliverables+'\nDEADLINE: '+(o.deadline||'Chưa đặt')+'\nNGÂN SÁCH: '+(o.budget||'Chưa đặt')+'\nTHƯƠNG HIỆU:\n'+JSON.stringify(o.brand)+'\nTÀI LIỆU THAM KHẢO:\n'+(o.reference||'Không có')+'\nBỔ SUNG TỪ KHÁCH:\n'+(o.clarifications||'Không có')+'\nPHẢN HỒI SỬA:\n'+(o.feedback||'Không có');}
function context(o){return briefContext(o)+'\n\nKẾT QUẢ BÀN GIAO:\n'+Object.entries(o.outputs).map(([k,v])=>'--- '+DEPTS[k].name+' ---\n'+v).join('\n\n');}
function archive(o,k){if(o.outputs[k])o.history.push({role:k,output:o.outputs[k],at:new Date().toISOString()});delete o.outputs[k];}
async function generate(o,role){o.runningRole=role;if(activeId===o.id){activeTab=role;render();}save();const response=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role,context:context(o),model:state.model,apiKey})});let body;try{body=await response.json();}catch{throw Error('Máy chủ chưa trả kết quả hợp lệ (HTTP '+response.status+'). Hãy thử lại từ bước này.');}if(!response.ok)throw Error(body.error||('Không tạo được đầu ra. HTTP '+response.status+'.'));$('#connectionLabel').textContent='AI đã xác minh';o.calls++;let result=body.output;if(role==='account'){let p;try{p=JSON.parse(result);}catch{throw Error('Account trả định dạng chưa hợp lệ. Bấm thử lại.');}if(typeof p.needs_clarification!=='boolean'||typeof p.summary!=='string'||!Array.isArray(p.departments)||!Array.isArray(p.acceptance)||!Array.isArray(p.questions))throw Error('Account thiếu thông tin điều phối. Bấm thử lại.');if(p.needs_clarification){o.questions=p.questions;o.status='clarify';}else{let depts=o.mode==='single'?[workRole(o.department)]:p.departments.filter(k=>['strategy','content','creative','performance'].includes(k));depts=[...new Set(depts)];if(!depts.length)throw Error('Account chưa chọn phòng ban. Hãy bổ sung brief.');p.departments=depts;o.pipeline=['account',...depts,'qa'];}result=JSON.stringify(p);}if(role==='qa'){let p;try{p=JSON.parse(result);}catch{throw Error('QA trả định dạng chưa hợp lệ. Bấm thử lại.');}if(typeof p.passed!=='boolean'||!Array.isArray(p.issues)||!Array.isArray(p.checklist)||typeof p.summary!=='string')throw Error('QA thiếu kết quả kiểm tra. Bấm thử lại.');o.qaPassed=p.passed&&p.issues.length===0&&p.checklist.length>0&&p.checklist.every(c=>c.passed===true);}o.outputs[role]=result;save();}
async function execute(o){if(busy)return;if(!apiKey&&!serverConfigured){if(o.receivedAt&&!o.outputs.account)o.status='received';else if(['revision','running'].includes(o.status)){o.status='error';o.error='Kết nối lại AI để tiếp tục bước đang dở.';}save();render();toast('Dùng kết nối AI tùy chọn để chạy tự động.');return;}busy=true;o.error=null;o.status='running';render();try{if(!o.outputs.account){await generate(o,'account');if(o.status==='clarify')return;}for(const role of o.pipeline.slice(1)){if(!o.outputs[role])await generate(o,role);}o.status=o.qaPassed?'review':'qa_failed';toast(o.qaPassed?'Agency đã bàn giao. Mời bạn duyệt.':'QA đã tìm thấy điểm cần sửa. Xem kết quả kiểm tra.');}catch(e){o.status='error';o.error=e.message;}finally{busy=false;o.runningRole=null;save();if(activeId===o.id)render();}}
function revise(o,feedback,qaOnly){if(busy)return;delete o.artwork;o.feedback=(o.feedback||'')+'\n'+feedback;o.revisionCount=(o.revisionCount||0)+1;let start=1;if(qaOnly){try{const issues=JSON.parse(o.outputs.qa).issues||[];const indices=issues.map(x=>o.pipeline.indexOf(x.department)).filter(i=>i>0);if(indices.length)start=Math.min(...indices);}catch{}}for(const k of o.pipeline.slice(start))archive(o,k);o.status='revision';o.approvedAt=null;save();execute(o);}
function download(name,text,type){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}
function exportOrder(o){download('MKT-'+o.id.slice(0,8)+'.md','# '+o.title+'\n\nTrạng thái: '+status(o)+'\n\n## Brief\n\n'+briefContext(o)+'\n\n'+o.pipeline.filter(k=>o.outputs[k]).map(k=>'## '+DEPTS[k].name+'\n\n'+formatJSON(k,o.outputs[k])).join('\n\n')+(o.approvedAt?'\n\nĐược khách duyệt: '+o.approvedAt:''),'text/markdown;charset=utf-8');}
async function checkConnectionFromForm() {
  const result = $('#checkResult');
  const key = $('#key').value.trim();
  const model = $('#model').value.trim();
  if ((!key && !serverConfigured) || !model) {
    result.textContent = 'Nhập OpenAI API key và Model ID cần kiểm tra.';
    return;
  }
  const button = $('#checkConnection');
  button.disabled = true;
  result.textContent = 'Đang kiểm tra với OpenAI…';
  try {
    const response = await fetch('/api/connection', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({apiKey:key,model}), signal:AbortSignal.timeout(20000)
    });
    const body = await response.json();
    result.textContent = response.ok && body.model
      ? 'Key truy cập được model ' + body.model + '. Lưu kết nối để dùng cho order.'
      : (body.error || 'Chưa xác minh được kết nối.');
  } catch {
    result.textContent = 'Không nhận được phản hồi. Hãy kiểm tra mạng và thử lại.';
  } finally {
    button.disabled = false;
  }
}

function openConnection(){if(hasAgencyInbox())return;$('#modalRoot').innerHTML='<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">Kết nối đội ngũ AI</h2><button class="close" id="closeModal" aria-label="Đóng">×</button></div><p class="muted">Studio đã có AI để thực hiện brief. Nhập key ở đây nếu bạn muốn dùng model OpenAI của riêng mình.</p><form id="connectionForm"><div class="field"><label for="key">OpenAI API key</label><input id="key" type="password" autocomplete="off" placeholder="sk-…" value="'+esc(apiKey)+'"><small>Key chỉ giữ trong bộ nhớ tab, không lưu vào workspace hay GitHub. Key được gửi qua máy chủ của app tới OpenAI khi bạn kiểm tra kết nối hoặc chạy order.</small></div><div class="field"><label for="model">Model ID</label><input id="model" required maxlength="100" value="'+esc(state.model)+'"><small>Model phải được tài khoản API của bạn cấp quyền sử dụng.</small></div><button type="button" class="btn small" id="checkConnection">Kiểm tra key và model</button><p id="checkResult" role="status" aria-live="polite"></p><div class="hint warning">Mỗi phòng ban là một lượt gọi API có tính phí. Order trọn gói tối đa 6 lượt mỗi vòng. Đóng hoặc tải lại tab sẽ ngắt luồng; có thể tiếp tục từ kết quả đã lưu.</div><p style="font-size:12px"><a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener noreferrer">Tạo API key tại OpenAI ↗</a></p><div class="form-actions"><button class="btn" type="button" id="forgetKey">Xóa key khỏi phiên</button><button class="btn primary" type="submit">'+(current()?.status==='draft'?'Kết nối & chạy order':'Lưu kết nối')+'</button></div></form></section></div>';$('#checkConnection').onclick=checkConnectionFromForm;$('#closeModal').onclick=()=>$('#modalRoot').innerHTML='';$('#forgetKey').onclick=()=>{apiKey='';updateConnection();$('#key').value='';toast('Đã xóa key khỏi bộ nhớ phiên.');};$('#connectionForm').onsubmit=e=>{e.preventDefault();const key=$('#key').value.trim();if(!key&&!serverConfigured){toast('Nhập API key để chạy AI.');return;}apiKey=key;state.model=$('#model').value.trim();save();updateConnection();$('#modalRoot').innerHTML='';toast('Đã lưu kết nối. Key được kiểm tra khi chạy order.');const order=current();if(order?.status==='draft'){if(hasAgencyInbox()&&!order.receivedAt)sendAgencyBrief(order);else execute(order);}else if(route==='detail')render();};$('#key').focus();}
document.querySelectorAll('[data-nav]').forEach(n=>n.onclick=()=>nav(n.dataset.nav));if(!hasAgencyInbox())$('#connect').onclick=openConnection;document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modalRoot').innerHTML='';});window.addEventListener('beforeunload',e=>{if(busy&&!hasAgencyInbox()){e.preventDefault();e.returnValue='';}});
for(const o of state.orders){if(o.status==='sending_brief'){o.status='not_sent';o.intakeError='Phiên gửi trước bị ngắt. Gửi lại để lấy biên nhận.';}if(!o.background&&['running','revision'].includes(o.status)){o.status='error';o.runningRole=null;o.error='Bấm tiếp tục để lấy kết quả đã lưu và hoàn thành các bước còn lại.';}}save();render();fetch('/api/status').then(r=>r.json()).then(s=>{serverConfigured=!!s.configured;studioImageConfigured=s.imageConfigured===true;updateConnection();if(route==='new')captureForm();if(['detail','home','new'].includes(route))render();}).catch(()=>{});

function openReceiptFromLink(){
  const match=/^#order\/([a-f0-9-]{36})$/i.exec(window.location?.hash||'');
  if(!match)return;
  const order=state.orders.find(item=>item.id===match[1]);
  if(!order){toast('Mở order trong trình duyệt đã gửi brief hoặc khôi phục bản sao workspace.');return;}
  activeId=order.id;activeTab='brief';nav('detail');
  resumeOfficeView(order);
}
window.addEventListener('hashchange',openReceiptFromLink);
openReceiptFromLink();
refreshOfficeList();
</script></body></html>
